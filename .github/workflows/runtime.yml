name: Runtime suite

# The runtime suite (`npm run test:runtime`, every `*.runtime.test.*`): real
# Chrome, ConPTY shells, Windows process probes and the bundled daemon. It used
# to run as `validate-runtime` in ci.yml on every pull request, where its
# timing-sensitive tests (ProtectedChrome among them) turned unrelated PRs red
# on a loaded runner. It is off the pull request path now, and runs:
#
# - nightly, on main;
# - on every push to main, so a regression is pinned to a merge or a short
#   range of merges, not a whole day. A newer push cancels the run in flight:
#   on a burst of merges only the last one runs, which keeps the cost at one
#   Windows job at a time;
# - on demand: `gh workflow run runtime.yml --ref <branch>` (or "Run workflow"
#   in the Actions tab) for a pull request that touches what this suite covers.
#
# Nothing requires this workflow to pass. A red run on main opens a
# `Nightly red: <workflow>` issue (scripts/ci-failure-issue.mjs), which the
# triage bot picks up; the next green run closes it.
on:
  schedule:
    # 18:23 UTC = 03:23 KST. Off the hour: scheduled runs on :00 queue longest.
    - cron: '23 18 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes to main share one group and supersede each other. The nightly and
  # manual runs get their own groups, so a merge never cancels them.
  group: runtime-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate-runtime:
    # The report steps below file and close an issue (issues) and read the
    # run's job list (actions). The workflow default stays read-only.
    permissions:
      contents: read
      issues: write
      actions: read
    runs-on: windows-latest
    # The runtime suite takes ~4-5 min plus setup; the cap only stops a hang.
    timeout-minutes: 25
    steps:
      # Same pins and toolchain as validate in ci.yml; see the comments there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '>=24.21.0 <25'
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # Two runtime suites drive the REAL bundled daemon (#546 boot marker,
      # #596 web restore). Both skip when `dist/daemon-bundle/index.js` is
      # absent, and a skip reads as green, so this step is what gives those
      # suites any signal at all.
      - name: Build daemon bundle (the runtime suites drive it)
        run: npm run build:daemon

      - name: Test (runtime suite)
        run: npm run test:runtime
        env:
          # Tells those suites the bundle was promised, so removing the step
          # above fails a test instead of silently retiring both files.
          WMUX_REQUIRE_DAEMON_BUNDLE: '1'

      # Last: a red run on main opens (or comments on) one `Nightly red:
      # <workflow>` issue, so the triage bot sees it; a green one closes it.
      # Off main this is a branch run someone dispatched and is watching.
      # scripts/lib/ci-failure-issue.mjs has the rules.
      - name: Report a red run as an issue
        if: failure() && github.ref == 'refs/heads/main'
        run: node scripts/ci-failure-issue.mjs --state failure
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Close the issue on a green run
        if: success() && github.ref == 'refs/heads/main'
        run: node scripts/ci-failure-issue.mjs --state success
        env:
          GH_TOKEN: ${{ github.token }}
